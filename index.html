
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mermaid Renderer</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      box-sizing: border-box;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      box-sizing: border-box;
      font-family: monospace;
    }

    button {
      padding: 8px 16px;
      margin: 8px 0;
      cursor: pointer;
    }

    #diagram {
      display: flex;
      justify-content: center;
      overflow: auto;
    }

    #diagram svg {
      max-width: 100%;
      height: auto;
    }

    #output {
      min-height: 100px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <section id="editor" hidden>
    <h2>Mermaid Renderer</h2>

    <textarea id="source">flowchart LR
    A[Developer] --> B[Mise]
    B --> C[Python]
    B --> D[Node.js]</textarea>

    <button id="generate">Generate Embed</button>

    <textarea id="output" readonly></textarea>

    <button id="copy">Copy HTML</button>
  </section>

  <div id="diagram"></div>

  <script type="module">
    import mermaid from
      'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    const params = new URLSearchParams(location.search);
    const code = params.get('code');

    const themes = ['default', 'neutral', 'dark', 'forest'];
    const requestedTheme = params.get('theme');

    const theme = themes.includes(requestedTheme)
      ? requestedTheme
      : 'neutral';

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'strict',
      theme: theme
    });

    const diagram = document.getElementById('diagram');
    const editor = document.getElementById('editor');
    const source = document.getElementById('source');
    const output = document.getElementById('output');

    let renderId = 0;

    async function render(text) {
      try {
        const { svg } = await mermaid.render(
          `mermaid-${++renderId}`,
          text
        );

        diagram.innerHTML = svg;
      } catch (error) {
        diagram.textContent = error.message;
      }
    }

    function generate() {
      const url = new URL(location.pathname, location.origin);

      url.searchParams.set('code', source.value);
      url.searchParams.set('theme', theme);

      const escapedURL = url.href.replaceAll('&', '&amp;');

      output.value =
        `<iframe src="${escapedURL}" ` +
        `width="100%" height="400" ` +
        `style="border:0" loading="lazy" ` +
        `title="Mermaid diagram"></iframe>`;

      render(source.value);
    }

    if (code !== null) {
      await render(code);
    } else {
      editor.hidden = false;
      generate();

      document.getElementById('generate')
        .addEventListener('click', generate);

      document.getElementById('copy')
        .addEventListener('click', async () => {
          await navigator.clipboard.writeText(output.value);
        });
    }
  </script>

</body>
</html>
